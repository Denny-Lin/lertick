name: Lertick checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check documents and local links
        run: python3 tests/check_docs.py
      - name: Test fixed-point arithmetic and learning
        run: make test-model
      - name: Test CPU service accounting
        run: make test-accounting
      - name: Test deterministic burst profiles
        run: make test-burst-profiles
      - name: Test confirmation configuration restoration
        run: python3 tests/test_confirmation.py
      - name: Test compact evidence counter audits
        run: python3 tests/test_compact_confirmation.py
      - name: Test paired online utility comparisons
        run: python3 tests/test_online_utility.py
      - name: Test CPU performance targets
        run: make test-cpuperf
      - name: Test the Lerwatt plug-in userspace
        run: make test-lerwatt
      - name: Test native deployment and loader runtime helpers without BPF attachment
        run: make test-deployment
      - name: Compile Linux regression and benchmark workloads
        run: make build/lifecycle_workload build/phase2_workload
      - name: Check script syntax
        run: |
          bash -n scripts/preflight.sh scripts/fetch_reference.sh scripts/build_libbpf.sh
          sh -n deploy.sh scripts/native_build.sh scripts/service_manager.sh tests/test_deploy.sh tests/test_service.sh
          python3 -m py_compile scripts/collect_report.py tests/test_report.py tests/test_loader_deployment.py tests/validate_linux.py tests/validate_phase2.py tests/validate_watchdog_flags.py benchmarks/run_phase2.py benchmarks/run_model_confirmation.py benchmarks/compact_confirmation.py benchmarks/analyze_phase2.py benchmarks/analyze_model_init.py benchmarks/analyze_online_utility.py scripts/qemu_vm.py

  musl-deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check runtime and deployment fixtures with musl and BusyBox
        run: |
          docker run --rm -v "$PWD:/source:ro" alpine:3.22 sh -ec '
            apk add --no-cache build-base linux-headers python3 bash util-linux
            mkdir /work
            cp -R /source/Makefile /source/src /source/vendor /source/scripts /source/tests /source/templates /source/deploy.sh /work/
            cd /work
            make test-deployment
          '
