name: Documentation and model

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check documents and local links
        run: python3 tests/check_docs.py
      - name: Test fixed-point arithmetic and learning
        run: make test-model
      - name: Check script syntax
        run: |
          bash -n scripts/preflight.sh scripts/fetch_reference.sh scripts/build_libbpf.sh
          python3 -m py_compile tests/validate_linux.py scripts/qemu_vm.py
