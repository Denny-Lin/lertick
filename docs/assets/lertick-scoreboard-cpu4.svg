<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="632" viewBox="0 0 1120 632" role="img" aria-labelledby="t d">
<title id="t">Lertick against other schedulers on 4 CPUs</title>
<desc id="d">On 4 CPUs, out of 11 benchmarks, Lertick against Linux EEVDF: better on 8, the same on 2, worse on 1. The previous Lertick version against sched_ext schedulers: scx_bpfland: better on 9, the same on 2, worse on 0; scx_lavd: better on 8, the same on 2, worse on 1; scx_p2dq: better on 7, the same on 2, worse on 2; scx_flash: better on 8, the same on 2, worse on 1.</desc>
<rect width="1120" height="632" rx="24" fill="#f5f5f7"/>
<text x="48.0" y="64.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#1d1d1f">4 CPUs: Lertick against other schedulers</text>
<text x="48.0" y="100.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#6e6e73">How many of 11 benchmarks Lertick is better on, the same on, or worse on.</text>
<rect x="48" y="125" width="14" height="14" rx="3" fill="#34c759"/>
<text x="70.0" y="137.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73">Better</text>
<rect x="147.2" y="125" width="14" height="14" rx="3" fill="#aeaeb2"/>
<text x="169.2" y="137.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73">Same (within 5%)</text>
<rect x="328.4" y="125" width="14" height="14" rx="3" fill="#ff3b30"/>
<text x="350.4" y="137.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#6e6e73">Worse</text>
<text x="48.0" y="194.0" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#1d1d1f">Linux EEVDF</text>
