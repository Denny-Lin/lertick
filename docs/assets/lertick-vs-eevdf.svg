<text x="420" y="205" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="13" fill="#86868b">4 CPUs</text>
<rect x="790.0" y="190" width="3.0" height="20" rx="5" fill="#aeaeb2"/>
