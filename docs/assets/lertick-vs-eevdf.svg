<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="954" viewBox="0 0 1160 954" role="img" aria-labelledby="t d">
<title id="t">Lertick compared with Linux EEVDF</title>
<desc id="d">Percentage difference of Lertick (learned mode) against Linux EEVDF on 11 kernel scheduler benchmarks not used for tuning, with 4 and 8 CPUs. Green is better than EEVDF, red is worse, grey is within 5%.</desc>
<rect width="1160" height="954" rx="24" fill="#f5f5f7"/>
<text x="48" y="64" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#1d1d1f">Lertick vs Linux default scheduler (EEVDF)</text>
<text x="48" y="100" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#6e6e73">Right is better than Linux. Upper bar 4 CPUs, lower bar 8 CPUs. Median of 5 runs.</text>
<line x1="790" y1="172" x2="790" y2="884" stroke="#86868b" stroke-width="2"/>
<text x="790" y="162" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#6e6e73">same as Linux</text>
<text x="680" y="162" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#ff3b30">← worse</text>
