<rect x="676.6" y="520" width="23.4" height="26" rx="6" fill="#aeaeb2"/>
<text x="666.6" y="539" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="589" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 4 msg threads, wakeup latency</text>
<rect x="669.4" y="570" width="30.6" height="26" rx="6" fill="#ff3b30"/>
<text x="659.4" y="589" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">5% higher</text>
<text x="48" y="639" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 4 msg threads, throughput</text>
<rect x="688.0" y="620" width="12.0" height="26" rx="6" fill="#aeaeb2"/>
<text x="678.0" y="639" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="689" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">Kernel compile (kernel/)</text>
<rect x="664.0" y="670" width="36.0" height="26" rx="6" fill="#ff3b30"/>
<text x="654.0" y="689" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">6% slower</text>
<text x="48" y="752" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#86868b">*EEVDF and scx_lavd take about 20 µs per pipe round trip in this VM. Linux 7.0, ARM64 VM. Bars past 40% are clipped.</text>
