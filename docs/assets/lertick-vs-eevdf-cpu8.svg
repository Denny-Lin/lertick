<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="t d">
<title id="t">Lertick compared with Linux EEVDF on 8 CPUs</title>
<desc id="d">Percentage difference of Lertick (learned mode) against Linux EEVDF on 8 CPUs, median over several sessions: better on 2, the same on 5, worse on 4 of 11 benchmarks not used for tuning. Green is better than EEVDF, red is worse, grey is within 5%.</desc>
<rect width="1120" height="780" rx="24" fill="#f5f5f7"/>
<text x="48" y="64" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#1d1d1f">8 CPUs: better on 2, worse on 4</text>
<text x="48" y="100" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#6e6e73">Lertick vs Linux default scheduler (EEVDF). Right is better. Median over 5–6 sessions.</text>
<line x1="700" y1="152" x2="700" y2="710" stroke="#86868b" stroke-width="2"/>
<text x="700" y="142" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#6e6e73">same as Linux</text>
<text x="590" y="142" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#ff3b30">← worse</text>
<text x="810" y="142" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#34c759">better →</text>
<text x="48" y="189" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">perf messaging, processes</text>
<rect x="659.8" y="170" width="40.2" height="26" rx="6" fill="#ff3b30"/>
<text x="649.8" y="189" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">7% slower</text>
<text x="48" y="239" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">perf messaging, threads</text>
<rect x="682.0" y="220" width="18.0" height="26" rx="6" fill="#aeaeb2"/>
<text x="672.0" y="239" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="289" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">perf pipe*</text>
<rect x="700.0" y="270" width="240.0" height="26" rx="6" fill="#34c759"/>
<path d="M929.0 274 L942.0 283.0 L929.0 292" fill="none" stroke="#f5f5f7" stroke-width="2.5"/>
<text x="950.0" y="289" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34c759">88% faster</text>
<text x="48" y="339" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">hackbench, threads</text>
<rect x="700.0" y="320" width="65.4" height="26" rx="6" fill="#34c759"/>
<text x="775.4" y="339" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34c759">11% faster</text>
<text x="48" y="389" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">hackbench, 16 groups</text>
<rect x="700.0" y="370" width="26.4" height="26" rx="6" fill="#aeaeb2"/>
<text x="736.4" y="389" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="439" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 1 thread, request latency</text>
<rect x="630.4" y="420" width="69.6" height="26" rx="6" fill="#ff3b30"/>
<text x="620.4" y="439" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">12% higher</text>
<text x="48" y="489" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 1 thread, wakeup latency</text>
<rect x="700.0" y="470" width="27.6" height="26" rx="6" fill="#aeaeb2"/>
<text x="737.6" y="489" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="539" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 4 msg threads, request latency</text>
<rect x="664.0" y="520" width="36.0" height="26" rx="6" fill="#ff3b30"/>
<text x="654.0" y="539" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">6% higher</text>
<text x="48" y="589" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 4 msg threads, wakeup latency</text>
<rect x="505.6" y="570" width="194.4" height="26" rx="6" fill="#ff3b30"/>
<text x="495.6" y="589" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">32% higher</text>
<text x="48" y="639" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 4 msg threads, throughput</text>
<rect x="700.0" y="620" width="3.0" height="26" rx="6" fill="#aeaeb2"/>
<text x="713.0" y="639" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="689" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">Kernel compile (kernel/)</text>
<rect x="700.0" y="670" width="3.6" height="26" rx="6" fill="#aeaeb2"/>
<text x="713.6" y="689" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="752" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#86868b">*EEVDF and scx_lavd take about 20 µs per pipe round trip in this VM. Linux 7.0, ARM64 VM. Bars past 40% are clipped.</text>
