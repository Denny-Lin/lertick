<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="t d">
<title id="t">Lertick compared with Linux EEVDF on 4 CPUs</title>
<desc id="d">Percentage difference of Lertick (learned mode) against Linux EEVDF on 4 CPUs, median of 5 runs: better on 5, the same on 3, worse on 3 of 11 benchmarks not used for tuning. Green is better than EEVDF, red is worse, grey is within 5%.</desc>
<rect width="1120" height="780" rx="24" fill="#f5f5f7"/>
<text x="48" y="64" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#1d1d1f">4 CPUs: better on 5, worse on 3</text>
<text x="48" y="100" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#6e6e73">Lertick vs Linux default scheduler (EEVDF). Right is better. One session, median of 5 runs.</text>
<line x1="700" y1="152" x2="700" y2="710" stroke="#86868b" stroke-width="2"/>
<text x="700" y="142" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#6e6e73">same as Linux</text>
<text x="590" y="142" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#ff3b30">← worse</text>
<text x="810" y="142" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#34c759">better →</text>
<text x="48" y="189" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">perf messaging, processes</text>
<rect x="644.2" y="170" width="55.8" height="26" rx="6" fill="#ff3b30"/>
<text x="634.2" y="189" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">9% slower</text>
<text x="48" y="239" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">perf messaging, threads</text>
<rect x="675.4" y="220" width="24.6" height="26" rx="6" fill="#aeaeb2"/>
<text x="665.4" y="239" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="289" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">perf pipe*</text>
<rect x="700.0" y="270" width="240.0" height="26" rx="6" fill="#34c759"/>
<path d="M929.0 274 L942.0 283.0 L929.0 292" fill="none" stroke="#f5f5f7" stroke-width="2.5"/>
<text x="950.0" y="289" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34c759">90% faster</text>
<text x="48" y="339" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">hackbench, threads</text>
<rect x="700.0" y="320" width="190.2" height="26" rx="6" fill="#34c759"/>
<text x="900.2" y="339" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34c759">32% faster</text>
<text x="48" y="389" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">hackbench, 16 groups</text>
<rect x="700.0" y="370" width="54.0" height="26" rx="6" fill="#34c759"/>
<text x="764.0" y="389" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34c759">9% faster</text>
<text x="48" y="439" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 1 thread, request latency</text>
<rect x="700.0" y="420" width="3.0" height="26" rx="6" fill="#aeaeb2"/>
<text x="713.0" y="439" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="489" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 1 thread, wakeup latency</text>
<rect x="700.0" y="470" width="94.8" height="26" rx="6" fill="#34c759"/>
<text x="804.8" y="489" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34c759">16% lower</text>
<text x="48" y="539" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 4 msg threads, request latency</text>
<rect x="529.6" y="520" width="170.4" height="26" rx="6" fill="#ff3b30"/>
<text x="519.6" y="539" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">28% higher</text>
<text x="48" y="589" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 4 msg threads, wakeup latency</text>
<rect x="501.4" y="570" width="198.6" height="26" rx="6" fill="#ff3b30"/>
<text x="491.4" y="589" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#ff3b30">33% higher</text>
<text x="48" y="639" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">schbench 4 msg threads, throughput</text>
<rect x="700.0" y="620" width="96.6" height="26" rx="6" fill="#34c759"/>
<text x="806.6" y="639" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34c759">16% more requests/s</text>
<text x="48" y="689" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="18" fill="#1d1d1f">Kernel compile (kernel/)</text>
<rect x="700.0" y="670" width="3.0" height="26" rx="6" fill="#aeaeb2"/>
<text x="713.0" y="689" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#6e6e73">same</text>
<text x="48" y="752" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" font-size="14" fill="#86868b">*EEVDF and scx_lavd take about 20 µs per pipe round trip in this VM. Linux 7.0, ARM64 VM. Bars past 40% are clipped.</text>
</svg>
