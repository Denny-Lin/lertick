<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Lertick. Learning, at the core of Linux.</title>
  <desc id="desc">A silver processor illustration on a light background. Lertick trains and predicts task CPU bursts inside eBPF and selects bounded new time-slice budgets. A compatible sched_ext kernel is required. Concept illustration, not a hardware measurement or application screenshot.</desc>
  <defs>
    <linearGradient id="headline" x1="0" x2="1">
      <stop stop-color="#0071e3"/>
      <stop offset=".6" stop-color="#4879de"/>
      <stop offset="1" stop-color="#7859cb"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".32" stop-color="#f3f4f6"/>
      <stop offset=".68" stop-color="#dce0e5"/>
      <stop offset="1" stop-color="#f5f6f8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf3"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#dbe9ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f5f5f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow">
      <stop stop-color="#777f90" stop-opacity=".18"/>
      <stop offset="1" stop-color="#777f90" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1120" height="640" rx="28" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="560" y="57" fill="#6e6e73" font-size="13" font-weight="600" letter-spacing="1.8">LEARNING INSIDE THE KERNEL</text>
    <text x="560" y="140" fill="#1d1d1f" font-size="68" font-weight="700" letter-spacing="-2.7">Learning, at the core.</text>
    <text x="560" y="215" fill="url(#headline)" font-size="68" font-weight="700" letter-spacing="-2.7">Built for Linux.</text>
    <text x="560" y="259" fill="#6e6e73" font-size="21">Task bursts. Learned slices. Your Linux scheduler.</text>
  </g>
  <ellipse cx="560" cy="422" rx="300" ry="153" fill="url(#halo)"/>
  <ellipse cx="560" cy="515" rx="193" ry="28" fill="url(#shadow)"/>
  <g stroke="#c6cbd3" stroke-width="7" stroke-linecap="round">
    <path d="M430 348h17m-17 25h17m-17 25h17m-17 25h17m-17 25h17m-17 25h17"/>
    <path d="M673 348h17m-17 25h17m-17 25h17m-17 25h17m-17 25h17m-17 25h17"/>
    <path d="M486 308v15m25-15v15m25-15v15m25-15v15m25-15v15m25-15v15m25-15v15"/>
    <path d="M486 497v15m25-15v15m25-15v15m25-15v15m25-15v15m25-15v15m25-15v15"/>
  </g>
  <rect x="446" y="323" width="228" height="181" rx="32" fill="#d1d6de"/>
  <rect x="444" y="318" width="232" height="181" rx="32" fill="url(#metal)" stroke="#c9ced7"/>
  <rect x="457" y="331" width="206" height="155" rx="23" fill="none" stroke="#fff" stroke-opacity=".9"/>
  <rect x="482" y="352" width="156" height="112" rx="18" fill="url(#core)" stroke="#c4cbd6"/>
  <g font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="560" y="422" fill="#30394b" font-size="52" font-weight="700" letter-spacing="-3">LT</text>
    <text x="560" y="447" fill="#6e6e73" font-size="10" font-weight="600" letter-spacing="2.7">LEARN + TICK</text>
  </g>
  <g fill="none" stroke="#c1c8d3" stroke-width="1.5">
    <path d="M308 390h91c14 0 16 17 31 17"/>
    <path d="M690 407c15 0 17-17 31-17h91"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif">
    <g text-anchor="end">
      <text x="307" y="374" fill="#1d1d1f" font-size="19" font-weight="600">In-kernel learning.</text>
      <text x="307" y="414" fill="#6e6e73" font-size="14">Per-task CPU-burst history.</text>
    </g>
    <g text-anchor="start">
      <text x="813" y="374" fill="#1d1d1f" font-size="19" font-weight="600">Adaptive slices.</text>
      <text x="813" y="414" fill="#6e6e73" font-size="14">Bounded, model-selected budgets.</text>
    </g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <path d="M373 555v37m374-37v37" stroke="#d2d2d7"/>
    <text x="187" y="569" fill="#1d1d1f" font-size="19" font-weight="600">Local. In eBPF.</text>
    <text x="187" y="592" fill="#6e6e73" font-size="13">Training and inference on your CPU.</text>
    <text x="560" y="569" fill="#1d1d1f" font-size="19" font-weight="600">Bounded budgets.</text>
    <text x="560" y="592" fill="#6e6e73" font-size="13">0.5–5 ms defaults after warm-up.</text>
    <text x="933" y="569" fill="#1d1d1f" font-size="19" font-weight="600">30-second trials.</text>
    <text x="933" y="592" fill="#6e6e73" font-size="13">Ctrl-C to stop. Kernel fallback.</text>
  </g>
</svg>
